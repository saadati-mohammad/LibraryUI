@if (isVisible) {
  <div
    class="modal-overlay"
    (click)="onOverlayClick($event)"
    (keydown.escape)="closeModal()"
    role="dialog"
    tabindex="0"
    aria-modal="true"
    [attr.aria-labelledby]="'modalTitle-' + title"
    >
    <div class="modal" #modalContent [style.maxWidth]="maxWidth">
      <div class="modal-header">
        <h2 class="modal-title" [id]="'modalTitle-' + title">
          {{ title }}
          @if (titleAccent) {
            <span class="page-title-accent">{{ titleAccent }}</span>
          }
        </h2>
        <button
          mat-icon-button
          class="modal-close-btn"
          (click)="closeModal()"
          [disabled]="isLoading"
          aria-label="بستن مودال"
          >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div class="modal-body">
        <ng-content select="[modal-body]"></ng-content>
      </div>
      @if (!hideFooter) {
        <div class="modal-footer">
          @if (!hideCancelButton) {
            <button
              mat-stroked-button
              color="basic"
              class="modal-cancel-btn"
              (click)="closeModal()"
              [disabled]="isLoading"
              >
              {{ cancelButtonText }}
            </button>
          }
          @if (!hideSubmitButton) {
            <button
              mat-raised-button
              color="primary"
              class="modal-submit-btn"
              (click)="onSubmit()"
              [disabled]="disableSubmit || isLoading"
              >
              @if (isLoading) {
                <mat-progress-spinner
                  diameter="20"
                  mode="indeterminate"
                  class="submit-spinner"
                ></mat-progress-spinner>
              }
              @if (submitButtonIcon && !isLoading) {
                <mat-icon>{{ submitButtonIcon }}</mat-icon>
              }
              @if (!isLoading) {
                <span>{{ submitButtonText }}</span>
              }
            </button>
          }
        </div>
      }
    </div>
  </div>
}
